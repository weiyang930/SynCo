[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synth_reasoner"
version = "1.0.0"
description = "SynCo: Synthesizer-Reasoner co-training for math reasoning (GRPO on UnityMAS-O star_ppo)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
